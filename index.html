/* ---- aviso sonoro ---- */
/* Dos notas de seno con caída suave, generadas al vuelo: sin archivos externos y
   sin nada que suene a alarma de teléfono. Al terminar el trabajo baja; al
   volver del descanso, sube. */
function desbloquearSonido(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctxAudio=ctxAudio||new AC();
    if(ctxAudio.state==="suspended") ctxAudio.resume();
  }catch(e){}
}
function sonar(tipo){
  if(!S.ajustes.sonido) return;
  try{
    desbloquearSonido(); if(!ctxAudio) return;
    const notas = tipo==="vuelta" ? [523.25,783.99] : [783.99,523.25];
    notas.forEach((f,i)=>{
      const o=ctxAudio.createOscillator(), g=ctxAudio.createGain();
      o.type="sine"; o.frequency.value=f;
      const t0=ctxAudio.currentTime+i*0.30;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.16,t0+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.70);
      o.connect(g); g.connect(ctxAudio.destination);
      o.start(t0); o.stop(t0+0.75);
    });
  }catch(e){}
}
/* ---- pantalla despierta ---- */
async function mantenerPantalla(encender){
  try{
    if(encender){
      if(!("wakeLock" in navigator)) return;
      if(!bloqueoPantalla) bloqueoPantalla=await navigator.wakeLock.request("screen");
    } else if(bloqueoPantalla){ await bloqueoPantalla.release(); bloqueoPantalla=null; }
  }catch(e){ bloqueoPantalla=null; }
}
/* Al volver a la app: recalcular, cerrar la fase si venció mientras no estabas
   y recuperar el bloqueo de pantalla, que iOS suelta al suspender. */
function alVolver(){
  const t=T(); if(!t) return;
  if(!t.agotada&&!t.enPausa&&t.fin&&restante()<=0) faseAgotada();
  else if(!t.agotada&&!t.enPausa&&t.fin) mantenerPantalla(true);
  if(pestana==="hoy") pintar();
}

/* ─────────── 7. GRÁFICAS ─────────── */
function lienzo(cont,W,H){
  const dpr=window.devicePixelRatio||2;
  const cv=document.createElement("canvas");
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width="100%"; cv.style.height=H+"px";
  cont.innerHTML=""; cont.appendChild(cv);
  const c=cv.getContext("2d"); c.scale(dpr,dpr); return c;
}
function dibujarEvolucion(p){
  const cont=$("grafEvo"); if(!cont) return;
  const hs=(p.historia||[]).slice(-60);
  if(hs.length<2){ cont.innerHTML='<p class="caption">La evolución aparecerá cuando haya varios registros.</p>'; return; }
  const W=Math.min(560,cont.clientWidth||320), H=90;
  const c=lienzo(cont,W,H);
  const x0=0,x1=W,y0=8,y1=H-16, Y=v=>y1-(v/100)*(y1-y0);
  [50,100].forEach(v=>{ c.setLineDash([3,4]); c.beginPath(); c.moveTo(x0,Y(v)); c.lineTo(x1,Y(v));
    c.strokeStyle="rgba(158,141,119,.35)"; c.lineWidth=1; c.stroke(); c.setLineDash([]); });
  const paso=(x1-x0)/(hs.length-1);
  c.beginPath(); hs.forEach((pt,i)=>{ const x=x0+i*paso,y=Y(pt.pct); i===0?c.moveTo(x,y):c.lineTo(x,y); });
  c.strokeStyle="#1D342E"; c.lineWidth=2; c.lineJoin="round"; c.stroke();
  c.beginPath(); c.arc(x1,Y(hs[hs.length-1].pct),4,0,Math.PI*2); c.fillStyle="#A18039"; c.fill();
  c.fillStyle="#6E766F"; c.font="11px Inter,sans-serif"; c.textAlign="left";
  c.fillText(fechaCorta(hs[0].fecha),0,H-2);
  c.textAlign="right"; c.fillText("hoy",W,H-2);
}
/* Rueda de áreas. Un solo tono, sin rampa multicolor: la comparación la hace
   la forma, no el color. Relleno = actual, punteado = deseada. */
function dibujarRueda(){
  const cont=$("rueda"); if(!cont) return;
  const as=areasPuntuadas(); const n=as.length;
  if(n<3){ cont.innerHTML=""; return; }
  const W=Math.min(560,cont.clientWidth||320), H=Math.min(360,W);
  const c=lienzo(cont,W,H);
  const cx=W/2, cy=H/2, R=Math.min(W,H)/2-46;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const P=(i,v)=>[cx+Math.cos(ang(i))*R*(v/10), cy+Math.sin(ang(i))*R*(v/10)];

  /* anillos y ejes */
  c.strokeStyle="rgba(158,141,119,.30)"; c.lineWidth=1;
  [2,4,6,8,10].forEach(v=>{ c.beginPath();
    for(let i=0;i<=n;i++){ const [x,y]=P(i%n,v); i===0?c.moveTo(x,y):c.lineTo(x,y); }
    c.stroke(); });
  for(let i=0;i<n;i++){ const [x,y]=P(i,10); c.beginPath(); c.moveTo(cx,cy); c.lineTo(x,y); c.stroke(); }

  /* deseada */
  if(as.some(a=>typeof a.deseada==="number")){
    c.setLineDash([4,4]); c.beginPath();
    as.forEach((a,i)=>{ const [x,y]=P(i,typeof a.deseada==="number"?a.deseada:a.actual); i===0?c.moveTo(x,y):c.lineTo(x,y); });
    c.closePath(); c.strokeStyle="#9E8D77"; c.lineWidth=1.5; c.stroke(); c.setLineDash([]);
  }
  /* actual */
  c.beginPath();
  as.forEach((a,i)=>{ const [x,y]=P(i,a.actual); i===0?c.moveTo(x,y):c.lineTo(x,y); });
  c.closePath(); c.fillStyle="rgba(29,52,46,.14)"; c.fill();
  c.strokeStyle="#1D342E"; c.lineWidth=2; c.lineJoin="round"; c.stroke();
  as.forEach((a,i)=>{ const [x,y]=P(i,a.actual); c.beginPath(); c.arc(x,y,3,0,Math.PI*2); c.fillStyle="#1D342E"; c.fill(); });

  /* etiquetas */
  c.font="11px Inter,sans-serif"; c.fillStyle="#56605A";
  as.forEach((a,i)=>{
    const [x,y]=P(i,11.6);
    c.textAlign = Math.abs(x-cx)<8 ? "center" : (x>cx?"left":"right");
    c.textBaseline = y<cy-8 ? "bottom" : (y>cy+8?"top":"middle");
    c.fillText(corto(a.nombre),x,y);
  });
}
