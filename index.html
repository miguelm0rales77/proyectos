<style>
/* ══════════ TOKENS · DESIGN.md §2 ══════════ */
:root{
  --verde-bosque:#1D342E; --verde-medio:#334F46; --salvia:#96A694;
  --salvia-claro:#E0E5D9; --salvia-niebla:#EFF2EC;
  --oro:#A18039; --oro-claro:#C4A96B; --oro-tostado:#7D6428; --oro-palido:#EFE6D2;
  --taupe:#9E8D77; --taupe-claro:#E4DCD0; --grafito:#2B322D;
  --crema:#FAF5EF; --papel:#FDFCFA; --blanco:#FFFFFF;
  --texto:#1D342E; --texto-2:#56605A; --texto-3:#6E766F;
  --texto-oscuro:#FAF5EF; --texto-apoyo-oscuro:#96A694;
  /* El ámbar de acción (§2.4) queda deliberadamente fuera: es color de conversión
     y esta app no vende nada. La acción principal es el primario verde bosque. */
  --exito:#276B4E; --exito-bg:#E4F1EA;
  --aviso:#7A6029; --aviso-bg:#FBF1DE;
  --error:#B3452F; --error-bg:#F8E8E3;
  --info:#3A5F6F; --info-bg:#E6EEF1;
  --campo-borde:#D9D2C6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--crema)}
body{
  background:var(--crema); color:var(--texto);
  font-family:Inter,-apple-system,'Segoe UI',Helvetica,sans-serif;
  font-size:16px; line-height:1.7; min-height:100vh;
  padding-bottom:64px;
}
/* ══════════ TIPOGRAFÍA · §3.2 ══════════ */
/* Escala móvil por defecto; tablet y desktop en los saltos de §8. */
h1,h2,h3,.display{font-family:'Cormorant Garamond','EB Garamond',Georgia,serif;color:var(--texto)}
.display{font-size:40px;font-weight:300;line-height:1.05;letter-spacing:-.01em}
h1{font-size:32px;font-weight:400;line-height:1.15;letter-spacing:-.005em}
h2{font-size:26px;font-weight:400;line-height:1.25}
h3{font-size:22px;font-weight:500;line-height:1.3}
h4{font-family:Inter;font-size:17px;font-weight:600;line-height:1.4}
.eyebrow{font-size:11px;font-weight:500;line-height:1.4;letter-spacing:.22em;text-transform:uppercase;color:var(--oro-tostado)}
.body-l{font-size:17px;line-height:1.7}
.small{font-size:14px;line-height:1.6;color:var(--texto-2)}
.caption{font-size:13px;line-height:1.5;letter-spacing:.01em;color:var(--texto-3)}
.num{font-variant-numeric:tabular-nums}
.serif-cita{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px;line-height:1.5;color:var(--texto-2)}
/* ══════════ LAYOUT · §5 ══════════ */
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.texto-max{max-width:680px}
.seccion{padding:64px 0}
.stack-8>*+*{margin-top:8px} .stack-16>*+*{margin-top:16px}
.stack-24>*+*{margin-top:24px} .stack-32>*+*{margin-top:32px}
.stack-48>*+*{margin-top:48px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.grid{display:grid;gap:24px}
/* ── Tablet · §8: 2 columnas, padding 48, escala intermedia ── */
@media(min-width:640px){
  .wrap{padding:0 48px}
  .grid.dos{grid-template-columns:1fr 1fr}
  .display{font-size:52px} h1{font-size:40px} h2{font-size:30px} h3{font-size:24px}
  h4{font-size:18px} .eyebrow{font-size:12px} .body-l{font-size:18px} .small{font-size:15px}
  body{font-size:17px}
  .serif-cita{font-size:22px}
  .top-in{height:80px}
  button.b{min-height:48px}
}
/* ── Desktop · §8: 12 columnas, padding 80, escala completa ── */
@media(min-width:1024px){
  .wrap{padding:0 80px}
  .seccion{padding:96px 0}
  .display{font-size:64px} h1{font-size:48px} h2{font-size:34px} h3{font-size:26px}
  .body-l{font-size:19px}
  .serif-cita{font-size:24px}
}
/* ══════════ NAVEGACIÓN · §4.4 ══════════ */
header.top{
  background:rgba(250,245,239,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--taupe-claro);
  position:sticky; top:0; z-index:50; padding-top:env(safe-area-inset-top);
}
/* §4.4 pide 80 px de cabecera. En móvil se reduce a 64: con la fila de pestañas
   debajo, 80 dejaría 128 px fijos, casi un quinto de la pantalla, y §5 antepone
   el aire. Desde 640 px se respeta el valor del documento. */
.top-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.marca{display:flex;align-items:baseline;gap:10px}
.marca .mono{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;letter-spacing:.06em}
.marca .mono .oro{color:var(--oro)}
.marca .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--texto-3)}
nav.tabs{display:flex;gap:24px;border-bottom:1px solid var(--taupe-claro);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:none;border:none;font-family:Inter;font-size:16px;color:var(--texto-2);
  padding:14px 0;cursor:pointer;white-space:nowrap;position:relative;
}
nav.tabs button.on{color:var(--texto);font-weight:500}
nav.tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--oro)}
/* ══════════ TARJETAS · §4.2 ══════════ */
.card{background:var(--blanco);border:1px solid var(--taupe-claro);border-radius:12px;padding:28px 32px}
.card.clic{cursor:pointer;transition:border-color 160ms ease-out,transform 160ms ease-out}
.card.clic:hover{border-color:var(--taupe);transform:translateY(-2px)}
.card.destacada{border-left:3px solid var(--oro);border-top-left-radius:0;border-bottom-left-radius:0}
.card.oscura{background:var(--verde-bosque);border:none;color:var(--texto-oscuro)}
.card.oscura h1,.card.oscura h2,.card.oscura h3{color:var(--texto-oscuro)}
.card.oscura .small,.card.oscura .caption{color:var(--texto-apoyo-oscuro)}
.card.oscura .eyebrow{color:var(--oro-claro)}          /* §2.6.3: sobre oscuro, oro claro */
.card.oscura .barra{background:rgba(250,245,239,.18)}
.card.oscura .barra>div{background:var(--texto-oscuro)}
.card.oscura .barra.tiempo>div{background:var(--salvia)}
.card.tenue{background:var(--salvia-niebla);border:none}
/* ══════════ BOTONES · §4.1 ══════════ */
/* Sin variante ámbar: §2.4 la reserva a conversión y esta app no vende nada.
   La acción principal es siempre el primario verde bosque (§4.1: enviar, guardar). */
button.b{font-family:Inter;font-size:16px;font-weight:500;letter-spacing:.01em;line-height:1;
  border-radius:999px;padding:14px 28px;min-height:52px;cursor:pointer;transition:all 160ms ease-out}
button.b:active{transform:scale(.98)}
button.b:focus-visible{outline:2px solid var(--verde-bosque);outline-offset:2px}
.b-primario{background:var(--verde-bosque);color:var(--texto-oscuro);border:none}
.b-primario:hover{background:var(--verde-medio)}
.b-secundario{background:transparent;color:var(--verde-bosque);border:1px solid var(--verde-bosque)}
.b-secundario:hover{background:var(--salvia-niebla)}
/* §4.1 · sobre oscuro: CTA dentro de una sección verde */
.b-oscuro{background:var(--texto-oscuro);color:var(--verde-bosque);border:none}
.b-oscuro:hover{background:var(--salvia-claro)}
.b-oscuro-2{background:transparent;color:var(--texto-oscuro);border:1px solid var(--salvia)}
.b-oscuro-2:hover{background:rgba(250,245,239,.10)}
.b-fantasma{background:transparent;color:var(--texto-2);border:none;padding:14px 16px}
.b-fantasma:hover{color:var(--texto)}
/* §8: área táctil mínima 48 × 48. El «mini» reduce el peso visual, no el objetivo. */
.b-mini{min-height:48px;padding:10px 18px;font-size:14px}
.b-full{width:100%}
.b-quitar{min-height:48px;width:48px;padding:0;background:none;border:none;color:var(--texto-3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.b-quitar:hover{color:var(--error)}
/* ══════════ FORMULARIOS · §4.3 ══════════ */
label.lb{display:block;font-size:15px;font-weight:500;color:var(--texto);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;min-height:48px;background:var(--blanco);border:1px solid var(--campo-borde);
  border-radius:8px;padding:12px 14px;font-family:Inter;font-size:17px;color:var(--texto);
}
textarea{min-height:96px;line-height:1.6;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--verde-bosque);box-shadow:0 0 0 3px rgba(29,52,46,.12)}
::placeholder{color:var(--texto-3)}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--texto-2) 50%),linear-gradient(135deg,var(--texto-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input[type=range]{width:100%;min-height:0;padding:0;border:none;background:none;accent-color:var(--verde-bosque)}
/* progreso · §4.3: pista taupe claro, relleno verde bosque, 4 px */
.barra{height:4px;background:var(--taupe-claro);border-radius:2px;overflow:hidden}
.barra>div{height:100%;background:var(--verde-bosque);border-radius:2px;transition:width 400ms ease-out}
.barra.gruesa{height:6px}
.barra.tiempo>div{background:var(--taupe)}
/* Escala de puntuación · §4.3: rampa de un solo tono, de salvia claro a verde
   medio, nunca rojo→verde. El punto elegido lleva anillo de 2 px en oro.
   Los tonos de la rampa los calcula rampa() en JS. */
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
@media(min-width:640px){.escala{grid-template-columns:repeat(10,1fr)}}
.escala button{min-height:48px;border-radius:8px;border:1px solid var(--taupe-claro);
  cursor:pointer;font-family:Inter;font-size:14px;font-variant-numeric:tabular-nums;transition:all 160ms ease-out}
.escala button.sel{outline:2px solid var(--oro);outline-offset:-2px;border-color:transparent}
/* Control segmentado: dos o tres opciones excluyentes. No es una escala, así que
   no lleva rampa; solo el anillo dorado de selección. */
.segmentado{display:flex;gap:6px}
.segmentado button{flex:1;min-height:48px;border-radius:8px;border:1px solid var(--taupe-claro);
  cursor:pointer;font-family:Inter;font-size:14px;color:var(--texto);background:var(--salvia-niebla);
  transition:all 160ms ease-out}
.segmentado button.sel{outline:2px solid var(--oro);outline-offset:-2px;background:var(--salvia-claro)}
/* Filtros. No son acciones: un filtro elegido no puede parecer el botón principal
   de la pantalla (§4.1 reserva el primario a enviar, guardar, continuar). */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:48px;padding:10px 18px;border-radius:999px;cursor:pointer;
  font-family:Inter;font-size:14px;color:var(--texto-2);background:transparent;
  border:1px solid var(--taupe-claro);transition:all 160ms ease-out}
.chips button:hover{border-color:var(--taupe);color:var(--texto)}
.chips button.sel{background:var(--salvia-niebla);color:var(--texto);border-color:transparent;
  outline:2px solid var(--oro);outline-offset:-2px}
/* ══════════ ELEMENTOS DE MARCA · §4.5 ══════════ */
/* Filete divisor: 64 px de línea en oro con un punto de 4 px centrado.
   28 + 2 + 4 + 2 + 28 = 64. */
.filete{display:flex;align-items:center;gap:2px;margin:16px 0}
.filete i{display:block;height:1px;width:28px;background:var(--oro)}
.filete b{display:block;width:4px;height:4px;border-radius:50%;background:var(--oro)}
.etiqueta{display:inline-block;font-size:13px;line-height:1;padding:6px 12px;border-radius:999px;
  background:var(--salvia-niebla);color:var(--texto-2);border:1px solid var(--taupe-claro)}
.etiqueta.oro{background:var(--oro-palido);color:var(--oro-tostado);border-color:transparent}
.etiqueta.exito{background:var(--exito-bg);color:var(--exito);border-color:transparent}
.etiqueta.aviso{background:var(--aviso-bg);color:var(--aviso);border-color:transparent}
.etiqueta.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.cita{background:var(--info-bg);border-left:3px solid var(--info);padding:16px 20px;border-radius:0 8px 8px 0}
/* ══════════ PROFUNDIDAD · §6 ══════════ */
.velo{position:fixed;inset:0;background:rgba(29,52,46,.45);z-index:100;display:none;
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px}
.velo.abierto{display:flex}
.modal{background:var(--blanco);border-radius:12px;box-shadow:0 12px 40px rgba(29,52,46,.16);
  width:100%;max-width:640px;padding:32px}
.aviso-flotante{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--verde-bosque);color:var(--texto-oscuro);padding:12px 24px;border-radius:999px;
  font-size:15px;display:none;max-width:90%}
/* misceláneo */
.lista-limpia{list-style:none}
.pend{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--salvia-niebla)}
.pend:last-child{border-bottom:none}
.check{position:relative;flex-shrink:0;width:20px;height:20px;border:1.5px solid var(--taupe);border-radius:4px;
  cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--blanco)}
/* La casilla se ve a 20 px pero se toca a 48 · §8 */
.check::after{content:'';position:absolute;top:-14px;left:-14px;right:-14px;bottom:-14px}
.check.on{background:var(--verde-bosque);border-color:var(--verde-bosque)}
.check.redonda{border-radius:50%}
.pend.hecha .txt{color:var(--texto-3);text-decoration:line-through}
.fila-area{padding:24px 0;border-bottom:1px solid var(--salvia-niebla)}
.fila-area:last-child{border-bottom:none}
/* ── Temporizador ── */
.reloj{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:72px;line-height:1;
  letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--texto-oscuro)}
@media(min-width:640px){.reloj{font-size:96px}}
.aro{height:4px;background:rgba(250,245,239,.18);border-radius:2px;overflow:hidden}
.aro>div{height:100%;background:var(--oro-claro);border-radius:2px;transition:width 1000ms linear}
.rondas{display:flex;gap:6px;align-items:center}
.rondas i{display:block;width:6px;height:6px;border-radius:50%;border:1px solid var(--salvia)}
.rondas i.on{background:var(--oro-claro);border-color:var(--oro-claro)}
/* ── Tareas del día ── */
.tarea{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--salvia-niebla)}
.tarea:last-child{border-bottom:none}
.tarea.enfocada{background:var(--oro-palido);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:8px;border-bottom-color:transparent}
.tarea .cuerpo{flex:1;min-width:0}
.tarea.hecha .txt{color:var(--texto-3);text-decoration:line-through}
.minutos{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--texto-3);font-size:13px}
.alta-tarea{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.alta-tarea input[type=text]{flex:1;min-width:180px}
.alta-tarea input[type=number]{width:96px;min-width:96px}
/* §7: iconografía lineal, trazo 1.5, esquinas redondeadas. Nunca rellena. */
svg.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="aviso" class="aviso-flotante"></div>

<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="marca">
        <span class="mono"><span class="oro">C</span>S<span class="oro">B</span></span>
        <span class="sub">Proyectos</span>
      </div>
      <button class="b b-fantasma b-mini" onclick="abrirAjustes()" aria-label="Ajustes">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

<main class="wrap" id="app"></main>
<div class="velo" id="velo"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   PROYECTOS · Como Sentirse Bien
   Motor reutilizado de DEKA Trainer, piel según DESIGN.md v1.0
   ─── Índice ───
   1. Estado, migración y persistencia
   2. Utilidades
   3. Modelo de dominio (áreas, ciclos, objetivos, proyectos)
   4. Pantallas: Hoy · Panel · Ciclo · Proyectos · Áreas · Revisión
   5. Overlays: detalle, edición, planificación, ajustes
   6. Temporizador: fases, aviso sonoro y pantalla despierta
   7. Gráficas: evolución y rueda de áreas
   8. Arranque
   ═══════════════════════════════════════════════════════════════ */

/* ─────────── 1. ESTADO, MIGRACIÓN Y PERSISTENCIA ─────────── */
const CLAVE="csb-proyectos-v1";
const CLAVE_PREVIA="csb-proyectos-v1-antes";   // red de seguridad para deshacer una restauración
const VERSION=4;
const SEMANAS_CICLO=12;

/* Preguntas del diario. La de la mañana es una premeditatio malorum: no busca
   agorerismo, busca que lo difícil no te pille de nuevas. La de la noche es un
   examen, no un juicio: §12 prohíbe el tono de productividad agresiva. */
const PREGUNTAS_MANANA=[
  ["dificultades","¿Qué puede torcerse hoy?","Lo previsible: una consulta larga, una conversación incómoda, cansancio"],
  ["control","De eso, ¿qué depende de ti?","Separa lo que puedes decidir de lo que solo puedes encajar"],
  ["intencion","¿Cómo quieres haber actuado cuando mires atrás esta noche?","Una intención, no una lista de tareas"]
];
const PREGUNTAS_NOCHE=[
  ["torcio","¿Qué se torció, de lo que esperabas y de lo que no?",""],
  ["bien","¿Qué hiciste bien, aunque el resultado no acompañara?",""],
  ["cambio","¿Qué harías distinto mañana?",""]
];

/* Ocho áreas de partida, adaptadas del esquema de evaluación por áreas vitales.
   Son editables: nombre, tipo, indicador y acción semanal. */
const AREAS_BASE=[
  ["Salud física","personal"],
  ["Energía mental","personal"],
  ["Familia y relaciones","personal"],
  ["Finanzas personales","personal"],
  ["Negocio clínico","negocio"],
  ["Negocio digital","negocio"],
  ["Aprendizaje y sistemas","personal"],
  ["Ocio y descanso","personal"]
];

const estadoInicial={
  areas:[], ciclos:[], objetivos:[], proyectos:[], revisiones:[],
  dias:[],                               // un registro por día con plan y diario
  focos:{fecha:null, ids:[]},
  temporizador:null,                     // ver §6 · sobrevive a recargas y suspensiones
  ajustes:{ nombre:"Miguel", diasSinTocar:10, avisoFecha:7, ultimaCopia:null,
            pomodoro:{trabajo:25, pausa:5, pausaLarga:15, rondas:4}, sonido:true },
  _v:VERSION
};

var S=cargar();

function cargar(){
  try{
    const r=localStorage.getItem(CLAVE);
    if(r) return normalizar(migrar(JSON.parse(r)));
  }catch(e){}
  return normalizar(JSON.parse(JSON.stringify(estadoInicial)));
}
/* Si el navegador se queda sin cuota, setItem lanza y hasta ahora se tragaba el
   error en silencio: seguías apuntando encima de algo que ya no se guardaba.
   Ahora se avisa una sola vez, no en cada tecla. */
let guardadoVivo=true;
function guardar(){
  try{ localStorage.setItem(CLAVE,JSON.stringify(S)); guardadoVivo=true; }
  catch(e){
    if(guardadoVivo){ guardadoVivo=false;
      try{ avisar("No se está guardando. Descarga una copia desde Ajustes."); }catch(_){}
    }
  }
}

/* Rellena huecos sin pisar lo que ya existe. Sobrevive a datos parciales. */
function normalizar(d){
  const base=JSON.parse(JSON.stringify(estadoInicial));
  const out=Object.assign(base,d||{});
  ["areas","ciclos","objetivos","proyectos","revisiones","dias"].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  out.focos=Object.assign({fecha:null,ids:[]},out.focos||{});
  out.ajustes=Object.assign({nombre:"Miguel",diasSinTocar:10,avisoFecha:7,sonido:true},out.ajustes||{});
  out.ajustes.pomodoro=Object.assign({trabajo:25,pausa:5,pausaLarga:15,rondas:4},out.ajustes.pomodoro||{});
  out.proyectos.forEach(p=>{ if(typeof p.minutos!=="number") p.minutos=0; });
  out.areas.forEach(a=>{ if(typeof a.reparto!=="number") a.reparto=null; });
  out.dias.forEach(x=>{
    if(!Array.isArray(x.tareas)) x.tareas=[];
    /* v3 escribía minutosSueltos y no lo leía nadie: era tiempo perdido */
    if(typeof x.minutosSueltos==="number"){ x.sueltos=(x.sueltos||0)+x.minutosSueltos; delete x.minutosSueltos; }
    if(typeof x.sueltos!=="number") x.sueltos=0;
  });
  out._v=VERSION;
  return out;
}

/* v1 → v2. El área era un texto suelto en cada proyecto; ahora es una entidad
   con puntuación propia. Se crean las áreas encontradas y se enlazan por id.
   Nada se descarta: las revisiones antiguas pasan a ser revisiones semanales.

   v2 → v3 no necesita tramo propio: solo añade claves nuevas (dias, temporizador,
   ajustes.pomodoro, proyecto.minutos) y de eso ya se encarga normalizar(). */
function migrar(d){
  if(!d) return d;
  if((d._v||1)>=2) return d;
  const out={
    areas:[], ciclos:[], objetivos:[], proyectos:[], revisiones:[],
    focos:{fecha:null,ids:[]},
    ajustes:Object.assign({nombre:"Miguel",diasSinTocar:10,avisoFecha:7},d.ajustes||{}),
    _v:2
  };
  const porNombre={};
  (d.proyectos||[]).forEach(p=>{
    const nom=(p.area||"Sin área").trim();
    if(!porNombre[nom]){ const a=crearArea(nom,adivinarTipo(nom)); out.areas.push(a); porNombre[nom]=a.id; }
    const np=Object.assign({},p,{
      areaId:porNombre[nom], objetivoId:null,
      para:p.para||null, archivado:p.estado==="completado"
    });
    delete np.area;
    out.proyectos.push(np);
  });
  (d.revisiones||[]).forEach(r=>{
    out.revisiones.push({id:uid(),tipo:"semanal",fecha:r.fecha,cicloId:null,
      funciono:r.notas||"", noFunciono:"", bloqueos:"", decisiones:"",
      focos:r.foco||[], puntuacion:null});
  });
  return out;
}
function adivinarTipo(nombre){
  return /consulta|clínic|clinic|web|contenido|tecnolog|negocio/i.test(nombre) ? "negocio" : "personal";
}
function crearArea(nombre,tipo){
  return {id:uid(),nombre:nombre,tipo:tipo||"personal",actual:null,deseada:null,
    reparto:null,                 // % del tiempo dedicable que dices que merece
    indicador:"",motivo:"",accion:"",revisado:null,historia:[]};
}

/* ─────────── 2. UTILIDADES ─────────── */
const $=id=>document.getElementById(id);
function h(html){ const t=document.createElement("template"); t.innerHTML=html.trim();
  return t.content.childNodes.length>1 ? t.content : t.content.firstChild; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hoy(d){ d=d||new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function desdeISO(s){ const a=String(s).split("-"); return new Date(+a[0],+a[1]-1,+a[2]); }
function dias(a,b){ return Math.round((desdeISO(b)-desdeISO(a))/864e5); }
function sumarDias(iso,n){ const d=desdeISO(iso); d.setDate(d.getDate()+n); return hoy(d); }
function fechaCorta(iso){ if(!iso) return "—"; const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const d=desdeISO(iso); return d.getDate()+" "+M[d.getMonth()]; }
function fechaLarga(){
  const D=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const d=new Date(); return D[d.getDay()]+" "+d.getDate()+" de "+M[d.getMonth()];
}
let temporizadorAviso=null;
function avisar(txt){ const a=$("aviso"); a.textContent=txt; a.style.display="block";
  clearTimeout(temporizadorAviso); temporizadorAviso=setTimeout(()=>a.style.display="none",2600); }
function modal(html){ const v=$("velo"); v.innerHTML='<div class="modal">'+html+'</div>'; v.classList.add("abierto");
  v.onclick=e=>{ if(e.target===v) cerrarModal(); }; }
function cerrarModal(){ $("velo").classList.remove("abierto"); $("velo").innerHTML=""; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function val(id){ const e=$(id); return e?e.value.trim():""; }
const filete='<div class="filete"><i></i><b></b><i></i></div>';
const tick='<svg class="ico" style="width:14px;height:14px;stroke:var(--crema)" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
const aspa='<svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';

/* Rampa de un solo tono para las escalas · §4.3: de salvia claro #E0E5D9 a
   verde medio #334F46. Nunca rojo→verde. Devuelve fondo y color de texto. */
function rampa(i,n){
  const a=[224,229,217], b=[51,79,70], t=n<2?1:(i-1)/(n-1);
  const c=a.map((v,k)=>Math.round(v+(b[k]-v)*t));
  return {fondo:"rgb("+c.join(",")+")", texto: t>.55 ? "var(--texto-oscuro)" : "var(--texto)"};
}

/* ─────────── 3. MODELO DE DOMINIO ─────────── */
/* área    = {id, nombre, tipo:"personal"|"negocio", actual, deseada,
              indicador, motivo, accion, revisado, historia:[{fecha,actual}]}
   ciclo   = {id, nombre, inicio, fin, estado:"activo"|"cerrado", cierre}
   objetivo= {id, nombre, areaId, cicloId, estado:"activo"|"logrado"|"soltado",
              porQue, resultado, metrica, prioridad, riesgos, creado}
   proyecto= {id, nombre, areaId, objetivoId, estado:"activo"|"pausado"|"completado",
              archivado, desc, modo:"hitos"|"manual", pct, para,
              hitos:[{id,texto,hecho}], pendientes:[{id,texto,hecho,para}],
              creado, tocado, historia:[{fecha,pct}]}
   revisión= {id, tipo:"semanal"|"mensual"|"cierre", fecha, cicloId,
              funciono, noFunciono, bloqueos, decisiones, focos:[], puntuacion} */

function area(id){ return S.areas.find(a=>a.id===id)||null; }
function objetivo(id){ return S.objetivos.find(o=>o.id===id)||null; }
function proy(id){ return S.proyectos.find(p=>p.id===id)||null; }
function nombreArea(id){ const a=area(id); return a?a.nombre:"Sin área"; }

function progreso(p){
  if(p.estado==="completado") return 100;
  if(p.modo==="manual") return Math.max(0,Math.min(100,p.pct||0));
  const t=(p.hitos||[]).length; if(!t) return 0;
  return Math.round((p.hitos.filter(x=>x.hecho).length/t)*100);
}
function vivos(){ return S.proyectos.filter(p=>!p.archivado); }
function activos(){ return vivos().filter(p=>p.estado==="activo"); }
function pendientesAbiertas(p){ return (p.pendientes||[]).filter(x=>!x.hecho); }
function todasPendientes(){
  const out=[];
  activos().forEach(p=>pendientesAbiertas(p).forEach(x=>out.push({p,x})));
  return out.sort((a,b)=>{ const A=a.x.para||"9999", B=b.x.para||"9999"; return A<B?-1:A>B?1:0; });
}
function desatendidos(){
  const lim=S.ajustes.diasSinTocar||10;
  return activos().filter(p=>p.tocado&&dias(p.tocado,hoy())>=lim);
}
function registrarProgreso(p){
  const pct=progreso(p), t=hoy();
  p.historia=p.historia||[];
  const ult=p.historia[p.historia.length-1];
  if(!ult||ult.fecha!==t) p.historia.push({fecha:t,pct}); else ult.pct=pct;
  p.tocado=t;
}

/* ---- ciclos ---- */
function cicloActivo(){ return S.ciclos.find(c=>c.estado==="activo")||null; }
function semanaCiclo(c){ if(!c) return 0; return Math.min(SEMANAS_CICLO+1,Math.floor(dias(c.inicio,hoy())/7)+1); }
function pctTiempo(c){ if(!c) return 0;
  const total=dias(c.inicio,c.fin)||1;
  return Math.max(0,Math.min(100,Math.round(dias(c.inicio,hoy())/total*100))); }
function objetivosDe(cicloId){ return S.objetivos.filter(o=>o.cicloId===cicloId); }
function proyectosDe(objetivoId){ return vivos().filter(p=>p.objetivoId===objetivoId); }
function progresoObjetivo(o){
  if(o.estado==="logrado") return 100;
  const ps=proyectosDe(o.id);
  if(!ps.length) return null;
  return Math.round(ps.reduce((a,p)=>a+progreso(p),0)/ps.length);
}
function avanceCiclo(c){
  if(!c) return 0;
  const os=objetivosDe(c.id).filter(o=>o.estado!=="soltado");
  if(!os.length) return 0;
  const vs=os.map(o=>progresoObjetivo(o)).map(v=>v==null?0:v);
  return Math.round(vs.reduce((a,b)=>a+b,0)/vs.length);
}

/* ---- focos de la semana ---- */
function focosVigentes(){
  if(!S.focos.fecha||dias(S.focos.fecha,hoy())>7) return [];
  return S.focos.ids.map(proy).filter(p=>p&&!p.archivado);
}
function esFoco(id){ return focosVigentes().some(p=>p.id===id); }

/* ---- fechas objetivo ---- */
function estadoFecha(iso){
  if(!iso) return null;
  const d=dias(hoy(),iso);
  if(d<0) return {clase:"error",txt:"Venció el "+fechaCorta(iso)};
  if(d===0) return {clase:"aviso",txt:"Es hoy"};
  if(d<=(S.ajustes.avisoFecha||7)) return {clase:"aviso",txt:"En "+d+" día"+(d>1?"s":"")};
  return {clase:"info",txt:fechaCorta(iso)};
}

/* ---- el día ---- */
/* dia = {fecha, manana:{...}, tareas:[tarea], noche:{...}, punt, cerrado}
   tarea = {id, texto, min, hecho, real, proyectoId, pendienteId, areaId} */
function dia(fecha){ return S.dias.find(x=>x.fecha===fecha)||null; }
function diaHoy(crear){
  let d=dia(hoy());
  if(!d&&crear){ d={fecha:hoy(),manana:null,tareas:[],noche:null,punt:null,cerrado:false}; S.dias.push(d); }
  return d;
}
function tareasDe(d){ return d?(d.tareas||[]):[]; }
function minPlan(d){ return tareasDe(d).reduce((a,t)=>a+(+t.min||0),0); }
function minReal(d){ return tareasDe(d).reduce((a,t)=>a+(+t.real||0),0); }
/* La puntuación objetiva pondera por minutos planificados: cerrar la tarea de dos
   horas no vale lo mismo que cerrar la de diez minutos. Sin minutos, cuenta tareas. */
function puntObjetiva(d){
  const ts=tareasDe(d); if(!ts.length) return null;
  const total=ts.reduce((a,t)=>a+(+t.min||0),0);
  if(total>0){
    const hecho=ts.filter(t=>t.hecho).reduce((a,t)=>a+(+t.min||0),0);
    return Math.max(1,Math.round(hecho/total*10));
  }
  return Math.max(1,Math.round(ts.filter(t=>t.hecho).length/ts.length*10));
}
function hhmm(min){
  min=Math.round(min||0);
  const h=Math.floor(min/60), m=min%60;
  return h? h+" h"+(m?" "+m+" min":"") : m+" min";
}
/* Sugerencias: nunca entran solas en el plan, solo se ofrecen. */
function sugerencias(){
  const d=diaHoy(false), puestas=new Set(tareasDe(d).map(t=>t.pendienteId||t.areaId).filter(Boolean));
  const out=[];
  todasPendientes().forEach(({p,x})=>{
    if(!x.para||puestas.has(x.id)) return;
    if(dias(x.para,hoy())>=0) out.push({clave:x.id,texto:x.texto,detalle:p.nombre,
      tipo:"pendiente",proyectoId:p.id,pendienteId:x.id,tarde:dias(x.para,hoy())>0});
  });
  S.areas.forEach(a=>{
    if(!a.accion||puestas.has(a.id)) return;
    out.push({clave:a.id,texto:a.accion,detalle:a.nombre,tipo:"area",areaId:a.id,tarde:false});
  });
  return out;
}
/* La semana, para la revisión */
function resumenSemana(){
  const ds=S.dias.filter(x=>dias(x.fecha,hoy())>=0&&dias(x.fecha,hoy())<7);
  const subj=ds.map(x=>x.punt).filter(v=>typeof v==="number");
  const obj=ds.map(puntObjetiva).filter(v=>typeof v==="number");
  const media=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  return {dias:ds.length, subjetiva:media(subj), objetiva:media(obj),
          minutos:ds.reduce((a,x)=>a+minReal(x),0)};
}

/* ═══════════ MOTOR DE TIEMPO ═══════════
   `proyecto.minutos` es un total sin fecha y no sirve para «esta semana». La
   verdad temporal vive en S.dias: cada tarea guarda sus minutos reales y de dónde
   viene. Todo lo de abajo reconstruye el reparto desde ahí.

   LÍMITE HONESTO: aquí solo hay tiempo REGISTRADO, cronometrado o imputado a
   mano. No es tu tiempo, es el que anotaste. Todo el copy debe decir «registrado».
   ═══════════════════════════════════════ */
function diasEntre(desde,hasta){ return S.dias.filter(x=>x.fecha>=desde&&x.fecha<=hasta); }
function ultimos(n){ return diasEntre(sumarDias(hoy(),-(n-1)),hoy()); }

/* Dónde acaba el minuto: empujando un objetivo del ciclo, en trabajo de fondo,
   en una acción de área, o suelto. */
function destinoTarea(t){
  if(t.proyectoId){ const p=proy(t.proyectoId); if(p) return p.objetivoId?"objetivo":"fondo"; }
  if(t.areaId) return "area";
  return "suelta";
}
function areaDeTarea(t){
  if(t.areaId) return t.areaId;
  if(t.proyectoId){ const p=proy(t.proyectoId); if(p) return p.areaId; }
  return null;
}
function repartoTiempo(ds){
  const out={objetivo:0,fondo:0,area:0,suelta:0,sinTarea:0,total:0};
  ds.forEach(d=>{
    (d.tareas||[]).forEach(t=>{ const m=+t.real||0; if(m<=0) return;
      out[destinoTarea(t)]+=m; out.total+=m; });
    const s=+d.sueltos||0; out.sinTarea+=s; out.total+=s;
  });
  return out;
}
function tiempoPorArea(ds){
  const out={};
  ds.forEach(d=>(d.tareas||[]).forEach(t=>{ const m=+t.real||0; if(m<=0) return;
    const a=areaDeTarea(t); if(a) out[a]=(out[a]||0)+m; }));
  return out;
}
function tiempoProyecto(ds,id){
  let m=0; ds.forEach(d=>(d.tareas||[]).forEach(t=>{ if(t.proyectoId===id) m+=+t.real||0; }));
  return m;
}
function tiempoObjetivo(ds,id){
  return proyectosDe(id).reduce((a,p)=>a+tiempoProyecto(ds,p.id),0);
}
function actividad(p){ return tiempoProyecto(ultimos(7),p.id); }

/* Reparto declarado, normalizado a 100. null si no has declarado ninguno. */
function repartoDeseado(){
  const con=S.areas.filter(a=>typeof a.reparto==="number"&&a.reparto>0);
  const suma=con.reduce((x,a)=>x+a.reparto,0);
  if(!suma) return null;
  const out={}; con.forEach(a=>{ out[a.id]=a.reparto/suma*100; });
  return out;
}
/* Dice y hace, por área, en porcentaje. Solo áreas con reparto declarado o con
   tiempo registrado; el resto no aportan nada a la comparación. */
function diceYHace(ds){
  const des=repartoDeseado(), real=tiempoPorArea(ds);
  const total=Object.values(real).reduce((a,b)=>a+b,0);
  const ids=new Set(Object.keys(real).concat(des?Object.keys(des):[]));
  const filas=[];
  ids.forEach(id=>{
    const a=area(id); if(!a) return;
    filas.push({area:a, dice:des?(des[id]||0):null,
      hace: total? (real[id]||0)/total*100 : 0, minutos: real[id]||0});
  });
  /* Ordenadas por desajuste, no por volumen: lo interesante es la distancia
     entre lo que dices y lo que haces, no cuál se lleva más horas. */
  filas.forEach(f=>{ f.desajuste = f.dice==null ? -1 : Math.abs(f.dice-f.hace); });
  return {filas:filas.sort((x,y)=>y.desajuste-x.desajuste||y.hace-x.hace), total, hayDeseado:!!des};
}
/* Tendencia de un objetivo: cuántos puntos ha ganado en siete días. */
function tendenciaObjetivo(o){
  const ps=proyectosDe(o.id); if(!ps.length) return null;
  const antes=ps.map(p=>{
    const h=(p.historia||[]).filter(x=>dias(x.fecha,hoy())>=7).pop();
    return h?h.pct:0;
  });
  const media=antes.reduce((a,b)=>a+b,0)/antes.length;
  return Math.round((progresoObjetivo(o)||0)-media);
}

/* ---- áreas ---- */
function areasPuntuadas(){ return S.areas.filter(a=>typeof a.actual==="number"); }
function brecha(a){ return (typeof a.actual==="number"&&typeof a.deseada==="number") ? a.deseada-a.actual : null; }
function areasPorBrecha(){
  return S.areas.slice().sort((x,y)=>{ const a=brecha(x),b=brecha(y);
    if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1; return b-a; });
}

/* Imputación manual · el temporizador solo ve el trabajo de escritorio. Correr,
   comer con los tuyos o una consulta larga no se cronometran, y sin esto el
   reparto por áreas quedaría sistemáticamente sesgado hacia lo que haces sentado. */
function imputarTiempo(id){
  const d=diaHoy(true), t=d.tareas.find(x=>x.id===id); if(!t) return;
  let html='<h2>Añadir tiempo</h2>'+filete+
    '<p class="body-l" style="color:var(--texto-2)">«'+esc(t.texto)+'»'+
    (t.real?' · '+hhmm(t.real)+' registrados hasta ahora':'')+'</p>'+
    '<div class="segmentado" style="margin-top:24px" id="rapidos"></div>'+
    '<div style="margin-top:16px"><label class="lb" for="impMin">O los minutos exactos</label>'+
    '<input type="number" id="impMin" min="1" max="600" step="5" placeholder="45"></div>'+
    '<div style="display:flex;gap:8px;margin-top:32px"><button class="b b-fantasma" onclick="cerrarModal()">Cancelar</button>'+
    '<button class="b b-primario" onclick="guardarImputacion(\''+id+'\')">Añadir</button>'+
    (t.real?'<button class="b b-fantasma" style="color:var(--error)" onclick="borrarTiempo(\''+id+'\')">Poner a cero</button>':'')+'</div>';
  modal(html);
  const cont=$("rapidos");
  [15,30,45,60,90].forEach(m=>{
    const b=h('<button>'+m+'</button>');
    b.onclick=()=>{ $("impMin").value=m;
      Array.from(cont.children).forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); };
    cont.appendChild(b);
  });
}
function guardarImputacion(id){
  const min=Math.round(+$("impMin").value||0);
  if(min<1){ avisar("Pon los minutos"); return; }
  sumarTiempo(id,min);
  cerrarModal(); pintar(); avisar(hhmm(min)+" añadidos");
}
function sumarTiempo(id,min){
  const d=diaHoy(true), t=d.tareas.find(x=>x.id===id); if(!t) return;
  t.real=(t.real||0)+min;
  if(t.proyectoId){ const p=proy(t.proyectoId);
    if(p){ p.minutos=(p.minutos||0)+min; p.tocado=hoy(); } }
  guardar();
}
function borrarTiempo(id){
  const d=diaHoy(true), t=d.tareas.find(x=>x.id===id); if(!t) return;
  if(t.proyectoId){ const p=proy(t.proyectoId);
    if(p) p.minutos=Math.max(0,(p.minutos||0)-(t.real||0)); }
  t.real=0; guardar(); cerrarModal(); pintar(); avisar("Tiempo borrado");
}
function addTarea(){
  const texto=val("nuevaTarea"); if(!texto) return;
  const min=+($("nuevaTareaMin").value)||0;
  const d=diaHoy(true);
  d.tareas.push({id:uid(),texto,min,hecho:false,real:0,proyectoId:null,pendienteId:null,areaId:null});
  guardar(); pintar(); avisar("Añadida al día");
}
/* Marcar la tarea del día cierra también la pendiente del proyecto si venía de ahí:
   una sola verdad, no dos listas que se contradicen. */
function marcarTarea(id){
  const d=diaHoy(true), t=d.tareas.find(x=>x.id===id); if(!t) return;
  t.hecho=!t.hecho;
  if(t.proyectoId&&t.pendienteId){
    const p=proy(t.proyectoId);
    const x=p&&(p.pendientes||[]).find(y=>y.id===t.pendienteId);
    if(x){ x.hecho=t.hecho; registrarProgreso(p); }
  }
  guardar(); pintar(); avisar(t.hecho?"Hecho":"Reabierta");
}

    });

  const caja=c.querySelector("#escalaDia");

}
/* Enseñar las dos juntas es el punto: la distancia entre lo que sentiste y lo que
   hiciste dice más que cualquiera de las dos por separado. */
function bloquePuntuaciones(subj,obj){
  const c=h('<div class="grid dos" style="margin-top:8px"></div>');
  c.appendChild(h('<div><div class="caption">Cómo lo viviste</div>'+
    '<div class="display num">'+(typeof subj==="number"?subj:"—")+'</div></div>'));
  c.appendChild(h('<div><div class="caption">Lo que cerraste</div>'+
    '<div class="display num">'+(obj==null?"—":obj)+'</div></div>'));
  if(typeof subj==="number"&&obj!=null&&Math.abs(subj-obj)>=3){
    c.appendChild(h('<p class="small" style="grid-column:1/-1">'+
      (subj<obj? "Lo has vivido peor de lo que fue. Merece la pena releer esto dentro de una semana."

  }
  return c;
}

/* ══════ PANEL · el cerebro ══════
   No es un resumen de lo que hay: es una respuesta a «¿estoy dedicando mi tiempo
   a lo que digo que importa?». Por debajo de dos horas registradas no opina. */
const MIN_DATO=120;
function lecturaSemana(){
  const ds=ultimos(7), r=repartoTiempo(ds), c=cicloActivo();
  if(r.total<MIN_DATO) return {tono:"neutro",
    txt:"Todavía hay poco tiempo registrado esta semana.",
    detalle:"Con dos o tres sesiones más, esto empezará a decir algo. Hasta entonces prefiero callarme a inventarte un diagnóstico."};
  const pctObj=Math.round(r.objetivo/r.total*100);
  const act=activos().length, desat=desatendidos().length;
  const t=c?pctTiempo(c):0, av=c?avanceCiclo(c):0;

  let peor=null;
  const dh=diceYHace(ds);
  if(dh.hayDeseado) dh.filas.forEach(f=>{
    if(f.dice==null) return;
    const d=f.dice-f.hace;
    if(d>=15&&(!peor||d>peor.d)) peor={f,d};
  });

  if(pctObj<30) return {tono:"aviso",
    txt:"Has registrado "+hhmm(r.total)+", y solo el "+pctObj+" % ha ido a tus objetivos.",
    detalle:"No siempre es un problema: hay semanas de mantenimiento. Pero merece una mirada en la revisión."};
  if(peor) return {tono:"aviso",
    txt:"Dices que "+peor.f.area.nombre+" merece un "+Math.round(peor.f.dice)+" % de tu tiempo. Esta semana ha recibido un "+Math.round(peor.f.hace)+" %.",
    detalle:"Puede que falte tiempo, o puede que falte registrarlo."};
  if(c&&t-av>=20) return {tono:"aviso",
    txt:"El ciclo va por delante: ha pasado el "+t+" % y tus objetivos están al "+av+" %.",
    detalle:"Lo que suele funcionar es recortar alcance, no apretar el ritmo."};
  if(desat>=3) return {tono:"aviso",
    txt:desat+" proyectos llevan más de "+S.ajustes.diasSinTocar+" días sin moverse.",
    detalle:"Soltar alguno es una decisión legítima, no una derrota."};
  if(pctObj>=60&&act>6) return {tono:"neutro",
    txt:"Dedicas tiempo suficiente a tus prioridades, pero tienes "+act+" frentes abiertos.",
    detalle:"El sistema aguanta mejor con menos proyectos vivos a la vez."};
  if(pctObj>=60) return {tono:"bien",
    txt:"El "+pctObj+" % de lo registrado ha ido a tus objetivos. La semana ha ido donde decías."};
  return {tono:"neutro",
    txt:"El "+pctObj+" % de lo registrado ha ido a tus objetivos."};
}

function verPanel(){
  const el=h('<div class="seccion stack-24"></div>');
  const c=cicloActivo(), act=activos(), pend=todasPendientes(), desat=desatendidos(), foc=focosVigentes();
  const ds=ultimos(7), r=repartoTiempo(ds);

  el.appendChild(h('<div><div class="eyebrow">Panel · '+fechaLarga()+'</div>'+
    '<h1 style="margin-top:8px">Esta semana</h1>'+filete+'</div>'));

  if(!S.proyectos.length&&!S.objetivos.length){
    el.appendChild(h('<div class="card texto-max stack-16"><h3>Empezamos por el ciclo</h3>'+
      '<p class="small">El sistema trabaja en bloques de doce semanas con uno a tres objetivos, no con listas interminables. '+
      'Abre un ciclo, elige pocos objetivos y cuelga de ellos los proyectos que de verdad estén vivos.</p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b b-primario" onclick="ir(\'ciclo\')">Abrir un ciclo</button>'+
      '<button class="b b-secundario" onclick="cargarEjemplos()">Cargar ejemplos</button></div></div>'));
    return el;
  }

  /* ── la lectura ── */
  const L=lecturaSemana();
  const cab=h('<div class="card oscura stack-16"></div>');
  cab.appendChild(h('<div class="row" style="align-items:flex-start">'+
    '<div class="eyebrow">'+(c?"Ciclo en curso":"Sin ciclo abierto")+'</div>'+
    (c?'<span class="etiqueta oro">Semana '+Math.min(semanaCiclo(c),SEMANAS_CICLO)+' de '+SEMANAS_CICLO+'</span>':'')+'</div>'));
  cab.appendChild(h('<h2>'+esc(L.txt)+'</h2>'));
  if(L.detalle) cab.appendChild(h('<p class="small">'+esc(L.detalle)+'</p>'));
  if(c){
    const av=avanceCiclo(c), t=pctTiempo(c);
    cab.appendChild(h('<div><div class="row"><span class="caption">Avance de los objetivos</span>'+
      '<span class="num small" style="color:var(--texto-oscuro)">'+av+' %</span></div>'+
      '<div class="barra gruesa" style="margin-top:6px"><div style="width:'+av+'%"></div></div>'+
      '<div class="row" style="margin-top:12px"><span class="caption">Tiempo del ciclo</span>'+
      '<span class="num caption">'+t+' %</span></div>'+
      '<div class="barra tiempo" style="margin-top:6px"><div style="width:'+t+'%"></div></div></div>'));
  } else {
    cab.appendChild(h('<button class="b b-mini b-oscuro" onclick="ir(\'ciclo\')">Abrir un ciclo</button>'));
  }
  el.appendChild(cab);

  /* ── a dónde fue el tiempo ── */
  el.appendChild(bloqueTiempo(r,ds));

  /* ── focos ── */
  if(foc.length){
    el.appendChild(h('<div><div class="eyebrow">Tus focos</div></div>'));
    const g=h('<div class="grid dos"></div>');
    foc.forEach(p=>g.appendChild(tarjetaProyecto(p)));
    el.appendChild(g);
  }

  /* ── objetivos con tendencia ── */
  if(c){
    const obs=objetivosDe(c.id).filter(o=>o.estado==="activo");
    if(obs.length){
      const co=h('<div class="card texto-max"><div class="eyebrow">Objetivos</div>'+
        '<div id="listaObj" style="margin-top:16px"></div></div>');
      const cont=co.querySelector("#listaObj");
      obs.forEach(o=>{
        const pct=progresoObjetivo(o), d=tendenciaObjetivo(o), min=tiempoObjetivo(ds,o.id);
        const flecha=d==null?"":d>=3?"↑":d<=-1?"↓":"→";
        const color=d==null?"var(--texto-3)":d>=3?"var(--exito)":d<=-1?"var(--error)":"var(--texto-3)";
        const f=h('<div class="fila-area" style="padding:14px 0"><div class="row">'+
          '<span style="font-weight:500">'+esc(o.nombre)+'</span>'+
          '<span class="num caption">'+(pct==null?"—":pct+" %")+
          (flecha?' <span style="color:'+color+'">'+flecha+'</span>':'')+'</span></div>'+
          '<div class="barra" style="margin-top:6px"><div style="width:'+(pct||0)+'%"></div></div>'+
          '<div class="caption" style="margin-top:6px">'+(min?hhmm(min)+' registrados esta semana':'sin tiempo registrado esta semana')+'</div></div>');
        f.onclick=()=>verObjetivo(o.id); f.style.cursor="pointer";
        cont.appendChild(f);
      });
      el.appendChild(co);
    }
  }

  /* ── fechas encima ── */
  const proximos=vivos().filter(p=>p.estado==="activo"&&p.para&&dias(hoy(),p.para)<=(S.ajustes.avisoFecha||7))
    .sort((a,b)=>a.para<b.para?-1:1);
  if(proximos.length){
    const cf=h('<div class="card texto-max"><div class="eyebrow">Fechas encima</div>'+
      '<div class="stack-8" id="listaFechas" style="margin-top:16px"></div></div>');
    const cont=cf.querySelector("#listaFechas");
    proximos.forEach(p=>{ const f=estadoFecha(p.para);
      const fila=h('<div class="row"><span>'+esc(p.nombre)+'</span>'+
        '<span class="etiqueta '+f.clase+'">'+esc(f.txt)+'</span></div>');
      fila.style.cursor="pointer"; fila.onclick=()=>verDetalle(p.id);
      cont.appendChild(fila); });
    el.appendChild(cf);
  }

  /* ── proyectos en riesgo: solo cuando hay algo que decidir ── */
  if(desat.length){
    const cr=h('<div class="card tenue"><div class="eyebrow" style="color:var(--aviso)">Piden una decisión</div>'+
      '<p class="small" style="margin-top:8px">'+desat.length+' proyecto'+(desat.length>1?'s llevan':' lleva')+
      ' más de '+S.ajustes.diasSinTocar+' días sin movimiento. Aparcar no es fracasar: es dejar de fingir que están vivos.</p>'+
      '<div id="listaRiesgo" style="margin-top:16px"></div></div>');
    const cont=cr.querySelector("#listaRiesgo");
    desat.forEach(p=>{
      const f=h('<div class="fila-area" style="padding:14px 0">'+
        '<div class="row"><span style="font-weight:500">'+esc(p.nombre)+'</span>'+
        '<span class="caption num">'+dias(p.tocado,hoy())+' días</span></div></div>');
      const acc=h('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>');
      const bp=h('<button class="b b-secundario b-mini">Aparcar</button>');
      bp.onclick=()=>{ p.estado="pausado"; p.tocado=hoy(); guardar(); pintar(); avisar("En pausa"); };
      const bs=h('<button class="b b-fantasma b-mini">Sigue viva</button>');
      bs.onclick=()=>{ p.tocado=hoy(); guardar(); pintar(); avisar("Marcada como viva"); };
      const bv=h('<button class="b b-fantasma b-mini">Ver</button>');
      bv.onclick=()=>verDetalle(p.id);
      acc.appendChild(bp); acc.appendChild(bs); acc.appendChild(bv);
      f.appendChild(acc); cont.appendChild(f);
    });
    el.appendChild(cr);
  }

  /* ── el resto de proyectos vivos ── */
  const resto=act.filter(p=>!esFoco(p.id)&&!desat.includes(p));
  if(resto.length){
    el.appendChild(h('<div style="margin-top:8px"><div class="eyebrow">'+(foc.length?"El resto":"Proyectos activos")+'</div></div>'));
    const lista=h('<div class="grid dos"></div>');
    resto.forEach(p=>lista.appendChild(tarjetaProyecto(p)));
    el.appendChild(lista);
  }

  /* ── lo siguiente ── */
  if(pend.length){
    const c3=h('<div class="card texto-max"><div class="eyebrow">Lo siguiente</div>'+
      '<div id="listaPend" style="margin-top:16px"></div></div>');
    const cont=c3.querySelector("#listaPend");
    pend.slice(0,6).forEach(({p,x})=>{
      const tarde=x.para&&dias(x.para,hoy())>0;
      const fila=h('<div class="pend"><div class="check" role="checkbox" aria-checked="false" tabindex="0"></div>'+
        '<div style="flex:1"><div class="txt">'+esc(x.texto)+'</div>'+
        '<div class="caption">'+esc(p.nombre)+(x.para?' · <span style="color:'+(tarde?"var(--error)":"var(--texto-3)")+'">'+fechaCorta(x.para)+'</span>':'')+'</div></div></div>');
      fila.querySelector(".check").onclick=()=>{ x.hecho=true; registrarProgreso(p); guardar(); pintar(); avisar("Hecho"); };
      cont.appendChild(fila);
    });
    el.appendChild(c3);
  }

  el.appendChild(h('<button class="b b-primario b-full" onclick="planificarSemana()">Planificar la semana</button>'));
  return el;
}

/* A dónde fue el tiempo registrado, y la comparación con lo que dices. */
function bloqueTiempo(r,ds){
  const c=h('<div class="card"><div class="row" style="align-items:flex-start">'+
    '<div class="eyebrow">Tiempo registrado · 7 días</div>'+
    '<span class="num" style="font-size:20px">'+hhmm(r.total)+'</span></div>'+
    '<div id="destinos" style="margin-top:16px"></div></div>');
  const cont=c.querySelector("#destinos");
  if(!r.total){
    cont.appendChild(h('<p class="small">Nada registrado todavía. El tiempo se anota desde Hoy: '+
      'con el temporizador, o a mano en cada tarea.</p>'));
    return c;
  }
  [["objetivo","Hacia objetivos"],["fondo","Trabajo de fondo"],["area","Acciones de área"],
   ["suelta","Tareas sueltas"],["sinTarea","Sin asignar"]].forEach(([k,lb])=>{
    const m=r[k]; if(!m) return;
    const pct=Math.round(m/r.total*100);
    cont.appendChild(h('<div style="margin-bottom:12px"><div class="row">'+
      '<span class="small">'+lb+'</span>'+
      '<span class="num caption">'+hhmm(m)+' · '+pct+' %</span></div>'+
      '<div class="barra" style="margin-top:6px"><div style="width:'+pct+'%"></div></div></div>'));
  });

  const dh=diceYHace(ds);
  if(dh.hayDeseado&&dh.total){
    c.appendChild(h('<div class="eyebrow" style="margin-top:32px">Lo que dices y lo que haces</div>'));
    const t=h('<div id="diceHace" style="margin-top:16px"></div>');
    /* Como mucho seis filas: una lista de ocho con seis ceros no se lee. */
    const visibles=dh.filas.filter(f=>f.hace>=1||f.desajuste>=10).slice(0,6);
    const ocultas=dh.filas.length-visibles.length;
    visibles.forEach(f=>{
      if(f.dice==null&&f.hace<1) return;
      const dice=f.dice==null?null:Math.round(f.dice), hace=Math.round(f.hace);
      const desvia=dice!=null&&Math.abs(dice-hace)>=15;
      t.appendChild(h('<div style="margin-bottom:14px"><div class="row">'+
        '<span class="small">'+esc(f.area.nombre)+'</span>'+
        '<span class="num caption"'+(desvia?' style="color:var(--aviso)"':'')+'>'+
        (dice==null?"—":dice+" %")+' → '+hace+' %</span></div>'+
        '<div class="barra" style="margin-top:6px"><div style="width:'+hace+'%"></div></div>'+
        (dice==null?'':'<div class="barra tiempo" style="margin-top:3px"><div style="width:'+dice+'%"></div></div>')+
        '</div>'));
    });
    c.appendChild(t);
    if(ocultas>0) c.appendChild(h('<p class="caption">'+ocultas+' área'+(ocultas>1?'s más sin desajuste apreciable':' más sin desajuste apreciable')+'.</p>'));
    c.appendChild(h('<p class="caption" style="margin-top:8px">Barra oscura: lo que has hecho. Barra clara: lo que dices que merece. '+
      'Solo cuenta el tiempo registrado, así que lo que no anotas no aparece aquí.</p>'));
  } else if(dh.total) {
    const b=h('<button class="b b-secundario b-mini" style="margin-top:24px">Declarar tu reparto</button>');
    b.onclick=()=>ir("areas");
    c.appendChild(h('<p class="caption" style="margin-top:24px">Si dices qué porcentaje de tu tiempo merece cada área, '+
      'aquí verás la distancia entre lo que dices y lo que haces.</p>'));
    c.appendChild(b);
  }
  return c;
}

function tarjetaProyecto(p){
  const pct=progreso(p), pend=pendientesAbiertas(p), o=objetivo(p.objetivoId);
  const c=h('<div class="card clic'+(esFoco(p.id)?" destacada":"")+(p.estado==="completado"?" tenue":"")+'"></div>');
  c.onclick=()=>verDetalle(p.id);
  c.appendChild(h('<div class="row" style="align-items:flex-start">'+
    '<div><div class="caption">'+esc(nombreArea(p.areaId))+(o?' · '+esc(o.nombre):'')+'</div>'+
    '<h3 style="margin-top:2px">'+esc(p.nombre)+'</h3></div>'+
    '<span class="etiqueta '+(p.estado==="activo"?"":p.estado==="completado"?"exito":"aviso")+'">'+
    (p.estado==="activo"?"Activo":p.estado==="completado"?"Completado":"En pausa")+'</span></div>'));
  c.appendChild(h('<div style="margin:16px 0 8px" class="row"><span class="caption">'+
    (p.modo==="hitos"?((p.hitos||[]).filter(x=>x.hecho).length+" de "+(p.hitos||[]).length+" hitos"):"Avance estimado")+
    '</span><span class="num" style="font-size:15px;font-weight:500">'+pct+' %</span></div>'));
  c.appendChild(h('<div class="barra"><div style="width:'+pct+'%"></div></div>'));
  /* Segunda dimensión: el porcentaje solo dice dónde está, no si se mueve.
     Un proyecto puede llevar dos meses al 68 %. La actividad lo delata. */
  const act=actividad(p), sinTocar=p.tocado?dias(p.tocado,hoy()):0;
  const parado=sinTocar>=(S.ajustes.diasSinTocar||10);
  c.appendChild(h('<div class="row" style="margin-top:12px">'+
    '<span class="caption">Actividad</span>'+
    '<span class="num caption"'+(parado?' style="color:var(--aviso)"':'')+'>'+
    (act? '↑ '+hhmm(act)+' esta semana' : parado? sinTocar+' días sin tocarse' : 'sin tiempo registrado')+
    '</span></div>'));
  const f=estadoFecha(p.para);
  c.appendChild(h('<p class="caption" style="margin-top:8px">'+
    (pend.length? pend.length+' pendiente'+(pend.length>1?'s':'')+' · ' : 'Sin pendientes · ')+
    'Último movimiento: '+fechaCorta(p.tocado)+
    (f?' · <span style="color:'+(f.clase==="error"?"var(--error)":f.clase==="aviso"?"var(--aviso)":"var(--texto-3)")+'">'+esc(f.txt)+'</span>':'')+
    '</p>'));
  return c;
}

/* ══════ CICLO ══════ */
function verCiclo(){
  const el=h('<div class="seccion stack-24"></div>');
  const c=cicloActivo();
  el.appendChild(h(cabecera("Doce semanas","Ciclo",
    "La unidad de avance no es el año, es el bloque de doce semanas. Uno a tres objetivos, ni uno más: lo que sobra se apunta y espera al siguiente ciclo.")));

  if(!c){
    const f=h('<div class="card texto-max stack-16"><div class="eyebrow">Nuevo ciclo</div>'+
      '<div><label class="lb" for="cNombre">Nombre</label>'+
      '<input type="text" id="cNombre" placeholder="Ciclo 1 · otoño" value="Ciclo '+(S.ciclos.length+1)+'"></div>'+
      '<div><label class="lb" for="cInicio">Empieza el</label><input type="date" id="cInicio" value="'+hoy()+'"></div>'+
      '<p class="caption">Durará doce semanas. La fecha de cierre se calcula sola.</p>'+
      '<button class="b b-primario" onclick="crearCiclo()">Abrir el ciclo</button></div>');
    el.appendChild(f);
  } else {
    const sem=semanaCiclo(c), av=avanceCiclo(c), t=pctTiempo(c), restan=Math.max(0,dias(hoy(),c.fin));
    const cab=h('<div class="card stack-16"></div>');
    cab.appendChild(h('<div class="row" style="align-items:flex-start">'+
      '<div><div class="eyebrow">En curso</div><h2 style="margin-top:4px">'+esc(c.nombre)+'</h2>'+
      '<p class="caption">'+fechaCorta(c.inicio)+' – '+fechaCorta(c.fin)+' · quedan '+restan+' días</p></div>'+
      '<span class="etiqueta oro">Semana '+Math.min(sem,SEMANAS_CICLO)+'/'+SEMANAS_CICLO+'</span></div>'));
    cab.appendChild(h('<div><div class="row"><span class="caption">Avance</span><span class="num small">'+av+' %</span></div>'+
      '<div class="barra gruesa" style="margin-top:6px"><div style="width:'+av+'%"></div></div>'+
      '<div class="row" style="margin-top:12px"><span class="caption">Tiempo</span><span class="num caption">'+t+' %</span></div>'+
      '<div class="barra tiempo" style="margin-top:6px"><div style="width:'+t+'%"></div></div></div>'));
    el.appendChild(cab);

    const obs=objetivosDe(c.id);
    el.appendChild(h('<div style="margin-top:8px"><div class="eyebrow">Objetivos ('+obs.length+' de 3)</div></div>'));
    if(!obs.length){
      el.appendChild(h('<div class="card tenue texto-max"><p class="body-l">Todavía no hay objetivos. Un objetivo no es una tarea: '+
        'es un resultado que sabrás reconocer cuando llegue, con una métrica que lo confirme.</p></div>'));
    }
    obs.forEach(o=>el.appendChild(tarjetaObjetivo(o)));

    if(obs.length>=3) el.appendChild(h('<p class="caption texto-max">Tres objetivos es el techo del sistema. Si aparece un cuarto, algo tiene que salir.</p>'));
    el.appendChild(h('<button class="b b-primario b-full" onclick="editarObjetivo()">Crear objetivo</button>'));
    el.appendChild(h('<button class="b b-secundario b-full" onclick="cerrarCiclo()">Cerrar el ciclo</button>'));
  }

  const cerrados=S.ciclos.filter(x=>x.estado==="cerrado");
  if(cerrados.length){
    const hist=h('<div class="card texto-max"><div class="eyebrow">Ciclos anteriores</div>'+
      '<div class="stack-16" id="histCiclos" style="margin-top:16px"></div></div>');
    const cont=hist.querySelector("#histCiclos");
    cerrados.slice().reverse().forEach(x=>{
      const os=objetivosDe(x.id), log=os.filter(o=>o.estado==="logrado").length;
      cont.appendChild(h('<div><div class="row"><span style="font-weight:500">'+esc(x.nombre)+'</span>'+
        '<span class="caption num">'+log+' de '+os.length+' logrados</span></div>'+
        '<div class="caption">'+fechaCorta(x.inicio)+' – '+fechaCorta(x.fin)+'</div>'+
        ((x.cierre&&x.cierre.aprendizajes)?'<p class="small" style="margin-top:6px;color:var(--texto-2)">'+esc(x.cierre.aprendizajes)+'</p>':'')+'</div>'));
    });
    el.appendChild(hist);
  }
  return el;
}
function tarjetaObjetivo(o){
  const pct=progresoObjetivo(o), ps=proyectosDe(o.id);
  const c=h('<div class="card clic'+(o.estado!=="activo"?" tenue":"")+'"></div>');
  c.onclick=()=>verObjetivo(o.id);
  c.appendChild(h('<div class="row" style="align-items:flex-start">'+
    '<div><div class="caption">'+esc(nombreArea(o.areaId))+'</div>'+
    '<h3 style="margin-top:2px">'+esc(o.nombre)+'</h3></div>'+
    '<span class="etiqueta '+(o.estado==="logrado"?"exito":o.estado==="soltado"?"":"oro")+'">'+
    (o.estado==="logrado"?"Logrado":o.estado==="soltado"?"Soltado":(o.prioridad||"media"))+'</span></div>'));
  if(o.resultado) c.appendChild(h('<p class="small" style="margin-top:8px">'+esc(o.resultado)+'</p>'));
  c.appendChild(h('<div style="margin:16px 0 8px" class="row"><span class="caption">'+
    (ps.length? ps.length+' proyecto'+(ps.length>1?'s':'') : 'Sin proyectos vinculados')+
    '</span><span class="num" style="font-size:15px;font-weight:500">'+(pct==null?"—":pct+" %")+'</span></div>'));
  c.appendChild(h('<div class="barra"><div style="width:'+(pct||0)+'%"></div></div>'));
  if(o.metrica) c.appendChild(h('<p class="caption" style="margin-top:12px">Métrica: '+esc(o.metrica)+'</p>'));
  return c;
}
function crearCiclo(){
  const nombre=val("cNombre")||"Ciclo "+(S.ciclos.length+1);
  const inicio=$("cInicio").value||hoy();
  S.ciclos.push({id:uid(),nombre,inicio,fin:sumarDias(inicio,SEMANAS_CICLO*7-1),estado:"activo",cierre:null});
  guardar(); pintar(); avisar("Ciclo abierto");
}
function cerrarCiclo(){
  const c=cicloActivo(); if(!c) return;
  const os=objetivosDe(c.id);
  let html='<h2>Cerrar el ciclo</h2>'+filete+
    '<p class="body-l" style="color:var(--texto-2)">Antes de cerrar, di qué pasó con cada objetivo. Soltar uno no es fracasar: es información sobre cuánto cabe de verdad en doce semanas.</p>'+
    '<div class="stack-16" style="margin-top:24px">';
  os.forEach(o=>{
    html+='<div><label class="lb">'+esc(o.nombre)+'</label><select id="fin_'+o.id+'">'+
      '<option value="logrado">Logrado</option><option value="activo" selected>Pasa al siguiente ciclo</option>'+
      '<option value="soltado">Soltado</option></select></div>';
  });
  html+='<div><label class="lb" for="cApre">Qué te llevas de estas doce semanas</label>'+

/* Observaciones, no reprimendas. Solo se dicen cuando hay dato suficiente para
   sostenerlas, y como mucho tres: una lista larga se lee como una regañina. */
function loQueLlamaLaAtencion(ds,rt){
  const out=[];
  if(rt.total<MIN_DATO){
    return ["Esta semana hay poco tiempo registrado, así que prefiero no sacar conclusiones."];
  }
  const foc=focosVigentes();
  if(foc.length){
    const enFocos=foc.reduce((a,p)=>a+tiempoProyecto(ds,p.id),0);
    const fuera=rt.total-enFocos;
    if(fuera>enFocos&&fuera>=120)
      out.push("Has dedicado "+hhmm(fuera)+" a cosas que no eran tus focos, frente a "+hhmm(enFocos)+" a los que sí.");
  }
  const pctObj=Math.round(rt.objetivo/rt.total*100);
  if(pctObj>=70) out.push("El "+pctObj+" % de lo registrado fue a objetivos del ciclo. Es una semana bien dirigida.");
  const dh=diceYHace(ds);
  if(dh.hayDeseado) dh.filas.forEach(f=>{
    if(out.length>=3||f.dice==null) return;
    const d=Math.round(f.dice-f.hace);
    if(d>=20) out.push(esc(f.area.nombre)+": dices un "+Math.round(f.dice)+" % y ha recibido un "+Math.round(f.hace)+" %.");
  });
  const quietos=activos().filter(p=>!tiempoProyecto(ds,p.id));
  if(out.length<3&&quietos.length>=3)
    out.push(quietos.length+" proyectos activos no han recibido ni un minuto esta semana.");
  return out.slice(0,3);
}
function guardarRevision(){

    focos:S.focos.ids.slice(), puntuacion:$("rPunt")?(+$("rPunt").value||null):null,
    decision:window._decision||null});
  guardar(); pintar(); avisar("Revisión guardada");
}

/* ---- planificación semanal: elegir 1-3 focos ---- */
function planificarSemana(){
  const act=activos();
  if(!act.length){ avisar("No hay proyectos activos que elegir"); return; }
  let html='<h2>Focos de la semana</h2>'+filete+
    '<p class="body-l" style="color:var(--texto-2)">Elige como mucho tres. Lo demás sigue existiendo, solo que esta semana no manda.</p>'+
    '<div id="listaFocos" style="margin-top:24px"></div>'+
    '<div style="display:flex;gap:8px;margin-top:32px"><button class="b b-fantasma" onclick="cerrarModal()">Cancelar</button>'+
    '<button class="b b-primario" onclick="guardarFocos()">Guardar</button></div>';
  modal(html);
  window._focos=focosVigentes().map(p=>p.id);
  const cont=$("listaFocos");
  act.forEach(p=>{
    const fila=h('<div class="pend"><div class="check redonda"></div>'+
      '<div style="flex:1"><div class="txt">'+esc(p.nombre)+'</div>'+
      '<div class="caption">'+esc(nombreArea(p.areaId))+' · '+progreso(p)+' %</div></div></div>');
    const ch=fila.querySelector(".check");
    ch.setAttribute("data-id",p.id);
    ch.setAttribute("role","checkbox");
    ch.onclick=()=>{
      const i=window._focos.indexOf(p.id);
      if(i>=0) window._focos.splice(i,1);
      else if(window._focos.length>=3){ avisar("Tres es el máximo — si entra uno, sale otro"); return; }
      else window._focos.push(p.id);
      marcarFocos();
    };
    cont.appendChild(fila);
  });
  marcarFocos();
}
/* Repinta solo las marcas, sin reconstruir el modal ni perder lo elegido. */
function marcarFocos(){
  const cont=$("listaFocos"); if(!cont) return;
  cont.querySelectorAll(".check").forEach(ch=>{
    const on=window._focos.indexOf(ch.getAttribute("data-id"))>=0;
    ch.classList.toggle("on",on);
    ch.setAttribute("aria-checked",on?"true":"false");
    ch.innerHTML=on?tick:"";
  });
}
function guardarFocos(){
  S.focos={fecha:hoy(),ids:(window._focos||[]).slice()};
  guardar(); cerrarModal(); pintar(); avisar(S.focos.ids.length?"Focos guardados":"Sin focos esta semana");
}

    '<textarea id="sDatos" style="font-family:\'JetBrains Mono\',Menlo,monospace;font-size:12px;margin-top:8px">'+esc(JSON.stringify(S))+'</textarea>'+
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
    '<button class="b b-secundario b-mini" onclick="copiarDatos()">Copiar texto</button>'+

    '<button class="b b-primario" onclick="guardarAjustes()">Guardar</button></div>');
}
function marcarSonido(v){ window._sonido=v;

  if(v) desbloquearSonido(); }

/* ---- copias de seguridad ----

   Ya había copia por portapapeles, pero una copia que solo vive en el
   portapapeles dura hasta que copies otra cosa: no es un sitio donde dejar algo
   a seis meses vista. Un archivo con la fecha en el nombre sí, y se recupera
   desde el móvil sin tener que pegar cien mil caracteres en un cuadro de texto.

   Restaurar sigue siendo inmediato, como hasta ahora: no se añade una pantalla
   de confirmación porque la red de seguridad es mejor que una pregunta. Antes de
   pisar nada se guarda una foto del estado anterior, y mientras esa foto exista
   aparece «Deshacer» en Ajustes. Un error deja de ser definitivo. */

function copiarDatos(){ const t=$("sDatos").value;
  if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
  marcarCopia();
  avisar("Copia guardada en el portapapeles"); }

function marcarCopia(){ S.ajustes.ultimaCopia=hoy(); guardar(); }

function diasDesdeCopia(){
  if(!S.ajustes||!S.ajustes.ultimaCopia) return null;
  return dias(S.ajustes.ultimaCopia, hoy());
}

function resumenEstado(d){
  const n=a=>Array.isArray(a)?a.length:0;
  return n(d.proyectos)+" proyectos · "+n(d.dias)+" días · "+n(d.ciclos)+" ciclos";
}

function descargarDatos(){
  try{
    const nombre="proyectos-"+hoy()+".json";
    const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url; a.download=nombre; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
    marcarCopia();
    avisar("Copia descargada");
  }catch(e){ avisar("No se pudo descargar la copia"); }
}

function cargarCopia(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const lector=new FileReader();
    lector.onload=()=>{ try{ aplicarDatos(JSON.parse(String(lector.result))); }
                        catch(e){ avisar("Ese archivo no es una copia válida"); } };
    lector.onerror=()=>avisar("No se pudo leer el archivo");
    lector.readAsText(f);
  };
  inp.click();
}

function restaurar(){ try{ aplicarDatos(JSON.parse($("sDatos").value)); }
  catch(e){ avisar("Ese texto no es válido"); } }

/* Único punto por el que se pisa el estado con una copia. Guarda la foto previa
   antes de tocar nada, y devuelve si lo hizo por si algún día hace falta. */
function aplicarDatos(d){
  if(!d||typeof d!=="object"||Array.isArray(d)){ avisar("Eso no es una copia de esta app"); return false; }
  try{ localStorage.setItem(CLAVE_PREVIA, JSON.stringify(S)); }catch(e){}
  S=normalizar(migrar(d));
  guardar(); cerrarModal(); pintar(); avisar("Datos restaurados");
  return true;
}

function hayCopiaPrevia(){ try{ return !!localStorage.getItem(CLAVE_PREVIA); }catch(e){ return false; } }

function deshacerRestauracion(){
  try{
    const r=localStorage.getItem(CLAVE_PREVIA);
    if(!r) return avisar("No hay nada que deshacer");
    S=normalizar(migrar(JSON.parse(r)));
    localStorage.removeItem(CLAVE_PREVIA);
    guardar(); cerrarModal(); pintar(); avisar("Vuelto a los datos anteriores");
  }catch(e){ avisar("No se pudo deshacer"); }
}

/* ═══════════════════════════════════════════════════════════════
   6. TEMPORIZADOR

   Dos decisiones que lo sostienen todo:

   1. El estado guarda una MARCA DE TIEMPO de fin, no un contador. iOS suspende
      la PWA al bloquear la pantalla, así que cualquier setInterval se congela.
      Calculando el restante contra Date.now() en cada pintada, el reloj es
      correcto al volver aunque hayan pasado veinte minutos.
   2. No se encadena solo. Al terminar una fase espera a que pulses la siguiente.
      Encadenar en segundo plano daría fases fantasma que nunca viste correr.

   Límite honesto: con el móvil bloqueado el aviso no suena en su momento. Se
   mitiga con Wake Lock, que impide que la pantalla se apague mientras corre.
   ═══════════════════════════════════════════════════════════════ */

var tic=null, ctxAudio=null, bloqueoPantalla=null;

function pom(){ return S.ajustes.pomodoro; }
function minutosFase(fase){
  const c=pom();
  return fase==="pausaLarga"?c.pausaLarga : fase==="pausa"?c.pausa : c.trabajo;
}
function T(){ return S.temporizador; }
function restante(){
  const t=T(); if(!t) return 0;
  if(t.enPausa) return t.restante;
  return Math.max(0,t.fin-Date.now());
}
function mmss(ms){
  const s=Math.ceil(ms/1000), m=Math.floor(s/60);
  return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}

function arrancarFase(fase,tareaId,ronda){
  const min=minutosFase(fase), ahora=Date.now();
  /* `trabajado` acumula solo el tiempo con el reloj corriendo; `desde` marca el
     arranque del tramo actual. Sin esta separación, una pausa de media hora se
     contabilizaba como media hora de trabajo. */
  S.temporizador={fase, ronda:ronda||1, tareaId:tareaId||null,
    inicio:ahora, desde:ahora, trabajado:0,
    fin:ahora+min*60000, enPausa:false, restante:0, agotada:false};
  desbloquearSonido(); mantenerPantalla(true);
  guardar(); pintar();
}
function empezarTrabajo(){
  const t=T();
  arrancarFase("trabajo", t?t.tareaId:null, t?t.ronda:1);
}
function empezarPausa(){
  const t=T(); if(!t) return;
  const larga = t.ronda % (pom().rondas||4) === 0;
  arrancarFase(larga?"pausaLarga":"pausa", t.tareaId, t.ronda);
}
function alternarPausa(){
  const t=T(); if(!t||t.agotada) return;
  if(t.enPausa){
    t.fin=Date.now()+t.restante; t.desde=Date.now(); t.enPausa=false; mantenerPantalla(true);
  } else {
    t.trabajado=trabajadoHasta(t); t.restante=restante(); t.enPausa=true; mantenerPantalla(false);
  }
  guardar(); pintar();
}
/* Tiempo con el reloj corriendo, topado en el fin de la fase: si iOS nos suspendió
   toda la noche, la sesión valió lo que duraba, no ocho horas. */
function trabajadoHasta(t){
  const base=t.trabajado||0;
  if(t.enPausa) return base;
  const desde=t.desde||t.inicio||Date.now();
  const hasta=Math.min(Date.now(), t.fin||Date.now());
  return base+Math.max(0,hasta-desde);
}
/* Parar registra el tiempo trabajado hasta ahora: media sesión también cuenta. */
function pararTemporizador(silencioso){
  const t=T(); if(!t) return;
  if(t.fase==="trabajo") registrarTiempo(t);
  S.temporizador=null; mantenerPantalla(false);
  guardar(); if(!silencioso){ pintar(); avisar("Temporizador parado"); }
}
function saltarFase(){
  const t=T(); if(!t) return;
  if(t.fase==="trabajo"){ registrarTiempo(t); t.agotada=true; t.enPausa=false; t.fin=Date.now(); guardar(); pintar(); }
  else { siguienteDespuesDePausa(); }
}
function siguienteDespuesDePausa(){
  const t=T(); if(!t) return;
  arrancarFase("trabajo", t.tareaId, (t.ronda||1)+1);
}
/* Se llama cuando la fase llega a cero, venga de un tic o de volver a la app. */
function faseAgotada(){
  const t=T(); if(!t||t.agotada) return;
  t.agotada=true; t.enPausa=false;
  if(t.fase==="trabajo") registrarTiempo(t);
  mantenerPantalla(false);
  sonar(t.fase==="trabajo"?"fin":"vuelta");
  guardar();
  if(pestana==="hoy") pintar();
}
function registrarTiempo(t){
  const min=Math.round(trabajadoHasta(t)/60000);
  if(min<1) return;
  const d=diaHoy(true);
  const tarea=t.tareaId&&d.tareas.find(x=>x.id===t.tareaId);
  if(tarea){
    tarea.real=(tarea.real||0)+min;
    if(tarea.proyectoId){ const p=proy(tarea.proyectoId);
      if(p){ p.minutos=(p.minutos||0)+min; p.tocado=hoy(); } }
  }
  if(!tarea) d.sueltos=(d.sueltos||0)+min;   // tiempo cronometrado sin tarea enfocada
}
function enfocarTarea(id){
  const t=T();
  if(t&&!t.agotada&&t.fase==="trabajo"&&t.tareaId&&t.tareaId!==id){
    avisar("Para la sesión antes de cambiar de tarea"); return;
  }
  if(t) t.tareaId=id; else S.temporizador={fase:"trabajo",ronda:1,tareaId:id,
    inicio:0,fin:0,enPausa:false,restante:0,agotada:true};
  guardar(); pintar();
}

/* ---- pintado ---- */
function bloqueTemporizador(d){
  const t=T(), c=pom();
  const listo = !t || t.agotada || !t.fin;
  const tarea = t&&t.tareaId&&d ? tareasDe(d).find(x=>x.id===t.tareaId) : null;
  const fase = t?t.fase:"trabajo";
  const etiqueta = fase==="trabajo"?"Trabajo":fase==="pausaLarga"?"Pausa larga":"Pausa";
  const total = minutosFase(fase)*60000;
  const ms = listo ? (t&&t.fin? 0 : total) : restante();
  const pctFase = total? Math.round((1-ms/total)*100) : 0;

  const total_rondas=c.rondas||4;
  const ronda=t?t.ronda:1;
  const enCiclo=((ronda-1)%total_rondas)+1;   // 1..rondas
  const puntos=Array.from({length:total_rondas},(_,i)=>'<i class="'+(i<enCiclo?"on":"")+'"></i>').join("");

  const card=h('<div class="card oscura stack-16"></div>');
  card.appendChild(h('<div class="row" style="align-items:flex-start">'+
    '<div class="eyebrow">'+esc(etiqueta)+'</div>'+
    '<div class="rondas" aria-label="Ronda '+enCiclo+' de '+total_rondas+'">'+puntos+'</div></div>'));
  card.appendChild(h('<div><div class="reloj num" id="reloj">'+mmss(ms)+'</div>'+
    '<div class="aro" style="margin-top:12px"><div id="aroFase" style="width:'+(listo?0:pctFase)+'%"></div></div></div>'));
  card.appendChild(h('<p class="small">'+(tarea?"Enfocado en «"+esc(tarea.texto)+"»":"Sin tarea enfocada — el tiempo no se asignará a ningún proyecto")+'</p>'));

  const acc=h('<div style="display:flex;gap:8px;flex-wrap:wrap"></div>');
  if(listo){
    if(t&&t.agotada&&t.fase==="trabajo"){
      acc.appendChild(boton("Empezar la pausa","b-oscuro",empezarPausa));
      acc.appendChild(boton("Seguir trabajando","b-oscuro-2",()=>siguienteDespuesDePausa()));
    } else if(t&&t.agotada&&t.fase!=="trabajo"&&t.fin){
      acc.appendChild(boton("Volver al trabajo","b-oscuro",siguienteDespuesDePausa));
    } else {
      acc.appendChild(boton("Empezar","b-oscuro",empezarTrabajo));
    }
  } else {
    acc.appendChild(boton(t.enPausa?"Reanudar":"Pausar","b-oscuro",alternarPausa));
    acc.appendChild(boton("Saltar","b-oscuro-2",saltarFase));
    acc.appendChild(boton("Parar","b-oscuro-2",()=>pararTemporizador()));
  }
  acc.appendChild(boton("Ciclos","b-oscuro-2",ajustarPomodoro));
  card.appendChild(acc);

  if(t&&t.agotada&&t.fase==="trabajo") card.appendChild(h('<p class="caption">Sesión terminada. El tiempo ya está anotado.</p>'));
  return card;
}
function boton(txt,clase,fn){
  const b=h('<button class="b b-mini '+clase+'">'+esc(txt)+'</button>');
  b.onclick=fn; return b;
}
/* Un solo intervalo, y solo toca el DOM: el estado no se mueve con el reloj. */
function refrescarReloj(){
  clearInterval(tic);
  tic=setInterval(()=>{
    const t=T(); if(!t||t.agotada||t.enPausa||!t.fin) return;
    const ms=restante();
    const r=$("reloj"); if(r) r.textContent=mmss(ms);
    const total=minutosFase(t.fase)*60000, a=$("aroFase");
    if(a) a.style.width=Math.round((1-ms/total)*100)+"%";
    if(ms<=0) faseAgotada();
  },1000);
}
function ajustarPomodoro(){

    '<div class="segmentado" style="margin-top:24px" id="preajustes"></div>'+

    '<div><label class="lb" for="pTrabajo">Trabajo</label><input type="number" id="pTrabajo" min="5" max="180" value="'+c.trabajo+'"></div>'+
